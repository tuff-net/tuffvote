name: Build and Release

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get next version
        id: version
        run: |
          # Get the latest release tag
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          
          if [ -z "$LATEST" ]; then
            NEXT="1.0"
          else
            # Extract version using regex
            if [[ "$LATEST" =~ ^0\. ]]; then
              # Coming from 0.x, start fresh at 1.0
              NEXT="1.0"
            elif [[ "$LATEST" =~ ^1\.([0-9]+)$ ]]; then
              # Increment 1.x versions
              MINOR=${BASH_REMATCH[1]}
              NEXT="1.$((MINOR + 1))"
            elif [ "$LATEST" = "1" ]; then
              NEXT="1.1"
            else
              # Fallback if format is unexpected
              NEXT="1.0"
            fi
          fi
          
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: tuffvote ${{ steps.version.outputs.version }}
          files: build/libs/TuffVote-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
